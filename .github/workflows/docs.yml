name: docs

# Build the MkDocs Material site and deploy it to GitHub Pages.
# Autodoc (mkdocstrings) only introspects the pure-Python public API, so the
# Rust extension does NOT need to be compiled here. If a future autodoc target
# requires the native `mudm_tools._rs` module, uncomment the "Build Rust" step.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; do not cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for git-revision dates, if enabled later

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      # - name: Build Rust extension (only if autodoc needs mudm_tools._rs)
      #   uses: dtolnay/rust-toolchain@stable
      # - run: uv run --group dev maturin develop --uv

      - name: Install docs dependencies
        run: uv sync --no-default-groups --group docs

      - name: Build site (strict)
        run: uv run mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
