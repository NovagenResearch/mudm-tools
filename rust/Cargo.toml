[package]
name = "microjson-tiling3d"
version = "0.1.0"
edition = "2021"

[lib]
name = "_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
rayon = "1.10"
ahash = "0.8"
byteorder = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
numpy = "0.23"
draco-oxide = "0.1.0-alpha.4"
meshopt = "0.6"
zstd = "0.13"
dashmap = "6"
parquet = { version = "54", features = ["default"] }
arrow = { version = "54", features = ["default", "pyarrow"] }
gltf = { version = "1.4", features = ["import", "utils"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# --- Build profiles -------------------------------------------------------
# Optimize ALL dependencies (incl. the vendored draco-oxide, pyo3, rayon) even
# in dev / `maturin develop` builds, while keeping THIS crate at the default
# dev opt-level for fast incremental compiles. Without this, `maturin develop`
# (no --release) builds draco-oxide at opt-level=0 — the cause of earlier
# pathologically-slow local Draco timings. Float-reorder-safe (Rust applies no
# implicit fast-math), so encoded bytes are unchanged across opt-levels — held
# by the Draco rebake guards.
[profile.dev.package."*"]
opt-level = 3

# Release wheels (CI `maturin build --release`): full cross-crate optimization.
# NG generate is encode-bound in draco-oxide, so LTO across the crate boundary
# (our crate <-> draco-oxide) is worth the longer build.
[profile.release]
lto = true
codegen-units = 1

# mudm-tools vendored fork of draco-oxide 0.1.0-alpha.4 with a one-line
# prelude visibility patch (exposes AttributeDomain + AttributeId) so the
# Draco encoder can build meshes in-memory instead of round-tripping ASCII
# .obj. Pinned to a vendored path source (deterministic; no branch/tag ref).
# Cargo.lock records this as `source = ... (path)` for the patched crate.
[patch.crates-io]
draco-oxide = { path = "vendor/draco-oxide" }
