[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mudm-tools"
version = "0.5.0"
description = "Processing pipelines, tiling engines, and format converters for muDM spatial data."
readme = "README.md"
authors = [
    { name = "Bengt Ljungquist", email = "bengt.ljungquist@nih.gov" },
]
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]
keywords = ["microscopy", "mudm", "tiling", "spatial-data", "vector-tiles"]
dependencies = [
    "mudm>=0.5.0",
    "pydantic>=2.3.0",
    "geojson-pydantic>=1.2.0",
    "geojson2vt>=1.0.1",
    "protobuf>=5.29.3",
    "geojson>=3.1.0",
    "shapely>=2.0.6",
    "mapbox-vector-tile>=2.1.0",
    "pyarrow>=19.0.1",
    "geopandas>=1.0.1",
    "jsonschema>=4.23.0",
    "pygltflib>=1.16",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
draco = ["DracoPy>=1.4"]

[project.scripts]
mudm-serve = "mudm_tools.serve:main"

[project.urls]
Documentation = "https://github.com/NovagenResearch/mudm-tools"
Source = "https://github.com/NovagenResearch/mudm-tools"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "mudm_tools._rs"
features = ["pyo3/extension-module"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mudm_tools.viewers" = ["**/*.html", "**/*.js", "**/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests/"]
pythonpath = ["src/", "scripts/"]

[dependency-groups]
dev = [
    "maturin>=1.13.1",
    "pytest>=9.0.3",
]
